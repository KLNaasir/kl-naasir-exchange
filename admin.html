
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL NAASIR EXCHANGE Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial,sans-serif}
main{max-width:420px;margin:65px auto;padding:20px}
.card{background:#102641;border:1px solid #29415e;border-radius:14px;padding:24px}
h2{color:#e8bd59;text-align:center}
p{color:#bdc9d8;text-align:center}
input{width:100%;padding:14px;margin:9px 0;border-radius:8px;border:1px solid #49617d;background:#071426;color:white}
button{width:100%;padding:14px;background:#d6aa45;color:#071426;border:0;border-radius:8px;font-weight:bold;margin-top:10px}
#message{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="card">
<h2>KL NAASIR EXCHANGE</h2>
<p>Admin Secure Login</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>
<p id="message">Geli email-ka iyo password-ka Admin-ka.</p>
</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://rxpluycceahzrnagcuzw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eWaOte-BYB6kjE9NAJIb3w_rt1a-HqQ';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const message = document.getElementById('message');
 message.textContent = 'Waa la hubinayaa...';

 const {data,error} = await supabase.auth.signInWithPassword({
  email: document.getElementById('email').value,
  password: document.getElementById('password').value
 });

 if(error){
  message.textContent = 'Login waa fashilmay. Hubi email-ka iyo password-ka.';
  return;
 }

 message.textContent = 'Login waa guuleystay. Admin waa la xaqiijiyey!';
});
</script>
</body>
</html>
