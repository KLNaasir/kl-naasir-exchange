
<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KL NAASIR - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1220; color: white;
    }
    .container {
      max-width: 850px; margin: 35px auto;
      background: #172235; padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #35d6a0; }
    input {
      width: 100%; padding: 14px; margin: 10px 0;
      border: 1px solid #40516a; border-radius: 8px;
      background: #0b1220; color: white;
    }
    button {
      padding: 13px 18px; border: 0;
      border-radius: 8px; background: #16a879;
      color: white; font-weight: bold; cursor: pointer;
    }
    .logout { background: #d94848; }
    .panel {
      background: #22324a; padding: 18px;
      margin-top: 18px; border-radius: 10px;
    }
    #dashboard { display: none; }
    #message { color: #ffd166; }
  </style>
</head>
<body>
  <div class="container">
    <h1>KL NAASIR EXCHANGE</h1>

    <section id="login">
      <h2>Admin Login</h2>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="message"></p>
    </section>

    <section id="dashboard">
      <h2>Admin Dashboard</h2>
      <p>Login waa guuleystay. Akoonka waa la galay.</p>
      <button class="logout" id="logoutBtn">Logout</button>

      <div class="panel">
        <h3>Dalabyada (Orders)</h3>
        <p>Dalabyada halkan ayay ka muuqan doonaan marka database-ka lagu xiro.</p>
      </div>

      <div class="panel">
        <h3>Payment Management</h3>
        <p>Maamulka lacag-bixinta waxaa lagu dari doonaa tallaabada xigta.</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // Ku beddel labada qiime xogta Supabase ee mashruucaaga.
    const SUPABASE_URL = "https://rxpluycceahzrnagcuzw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eWaOte-BYB6kjE9NAJIb3w_rt1a-HqQ";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    function showDashboard() {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
    }

    function showLogin() {
      dashboard.style.display = "none";
      loginSection.style.display = "block";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Fadlan sug...";

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Login waa fashilmay: " + error.message;
        return;
      }

      message.textContent = "";
      showDashboard();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLogin();
      message.textContent = "Waad ka baxday akoonka.";
    });

    const { data } = await supabase.auth.getSession();

    if (data.session) {
      showDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
